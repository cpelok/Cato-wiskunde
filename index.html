<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wiskunde oefenen voor Cato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E9EEF5; --paper:#FFFFFF; --grid:#DCE6F2; --ink:#1C2340; --muted:#5D6680; --line:#CBD5E3;
  --c1:#E2702A; --c1s:#FDEBDD; --c2:#2C9158; --c2s:#DDF2E5; --cm:#3A4E9C; --cms:#E3E8F8;
  --good:#23824C; --goods:#E1F4E8; --bad:#C93A2C; --bads:#FBE7E4; --almost:#B47A08; --almosts:#FBF0D6;
  --face:#F7E7D2; --key:#F3F6FA; --keyh:#E4EAF2;
  --ac:var(--cm); --acs:var(--cms);
  --ui:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --math:"STIX Two Text", "Times New Roman", Georgia, serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#11141B; --paper:#1A1F2A; --grid:#252D3C; --ink:#E8EBF2; --muted:#A3ABBF; --line:#323B4D;
    --c1:#F08A48; --c1s:#3A2619; --c2:#4CBD7C; --c2s:#17321F; --cm:#8C9CF0; --cms:#232A4A;
    --good:#5ACB86; --goods:#16301F; --bad:#F07062; --bads:#3A1B18; --almost:#E5B23E; --almosts:#352A12;
    --face:#3A3228; --key:#242B38; --keyh:#2E3747;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --desk:#11141B; --paper:#1A1F2A; --grid:#252D3C; --ink:#E8EBF2; --muted:#A3ABBF; --line:#323B4D;
  --c1:#F08A48; --c1s:#3A2619; --c2:#4CBD7C; --c2s:#17321F; --cm:#8C9CF0; --cms:#232A4A;
  --good:#5ACB86; --goods:#16301F; --bad:#F07062; --bads:#3A1B18; --almost:#E5B23E; --almosts:#352A12;
  --face:#3A3228; --key:#242B38; --keyh:#2E3747;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.ch1{--ac:var(--c1);--acs:var(--c1s)} .ch2{--ac:var(--c2);--acs:var(--c2s)} .chm{--ac:var(--cm);--acs:var(--cms)}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.1}
.paper{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;border-radius:6px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(28,35,64,.45)}

/* ---------- start ---------- */
.hello{padding:18px 2px 22px}
.hello h1{font-size:clamp(44px,13vw,64px);font-weight:800;letter-spacing:-.03em}
.hello p{margin:6px 0 0;color:var(--muted);max-width:34ch}
.tiles{display:grid;gap:14px}
.tile{display:block;width:100%;text-align:left;border:0;padding:18px 18px 16px 26px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--ac)}
.tile .no{font-family:var(--math);font-size:15px;color:var(--ac);font-weight:600}
.tile h2{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:2px 0 6px}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .bar{margin-top:12px}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:15px}
.ghost:hover{border-color:var(--ac)}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}

/* ---------- hoofdstuk ---------- */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:0;background:transparent;font-size:15px;color:var(--muted);padding:8px 4px}
.chhead{padding:4px 2px 16px}
.chhead .no{font-family:var(--math);color:var(--ac);font-weight:600}
.chhead h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.big{display:block;width:100%;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:18px;padding:15px 18px;text-align:center}
:root[data-theme="dark"] .big{color:#10131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big{color:#10131A}}
.big small{display:block;font-weight:400;font-size:14px;opacity:.9}
.big:disabled{opacity:.45;cursor:default}
.pars{margin-top:16px;padding:6px 0}
.par{display:grid;grid-template-columns:44px 1fr;gap:4px 10px;padding:14px 16px;border-bottom:1px dashed var(--line)}
.par:last-child{border-bottom:0}
.par .pn{font-family:var(--math);font-weight:600;font-size:18px;color:var(--ac);padding-top:1px}
.par h3{font-size:18px;font-weight:600}
.par .meta{grid-column:2;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.par .meta .bar{flex:1;max-width:160px;height:6px}
.par .acts{grid-column:2;display:flex;gap:8px;margin-top:6px}
.pill{border:1.5px solid var(--ac);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:600}
.pill.fill{background:var(--ac);color:#fff}
:root[data-theme="dark"] .pill.fill{color:#10131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill.fill{color:#10131A}}

/* ---------- uitleg ---------- */
.uitleg{padding:18px 18px 8px}
.uitleg ol{margin:0;padding-left:22px}
.uitleg li{margin:0 0 14px;font-size:17px;line-height:1.6}
.uitleg .m{font-family:var(--math);font-size:1.08em}

/* ---------- quiz ---------- */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);display:flex;align-items:center;gap:12px;padding:10px 0 12px;margin:-8px 0 6px}
.qbar .x{border:0;background:var(--paper);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1;box-shadow:0 0 0 1.5px var(--line)}
.qbar .bar{flex:1;height:10px}
.qbar .cnt{font-family:var(--math);font-size:16px;color:var(--muted);min-width:44px;text-align:right}
.card{padding:16px 16px 18px;position:relative}
.chip{display:inline-block;font-size:13px;font-weight:600;color:var(--ac);background:var(--acs);border-radius:99px;padding:3px 10px}
.lvl{font-size:13px;color:var(--muted);margin-left:8px}
.prompt{font-size:19px;font-weight:600;margin:10px 0 4px;max-width:36ch}
.expr{font-family:var(--math);font-size:30px;line-height:1.5;margin:10px 0 6px;padding:6px 0;overflow-x:auto;white-space:nowrap}
.expr .blank{display:inline-block;min-width:1.6em;text-align:center;color:var(--ac);border-bottom:2px solid var(--ac);margin:0 .2em;line-height:1}
.fig{display:block;width:100%;max-width:300px;height:auto;margin:8px auto 0}
.fig .face{fill:var(--face)} .fig .face.net{stroke:var(--ink);stroke-width:1.6}
.fig .vis{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.fig .hid{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;fill:none;opacity:.8}
.fig .lb{font-family:var(--math);font-style:italic;font-size:15px;fill:var(--ink);text-anchor:middle}
.fig .dm{font-family:var(--math);font-size:14px;fill:var(--ac);text-anchor:middle;font-weight:600}
.fig .dot{fill:var(--ink)}
.figcap{text-align:center;font-size:13px;color:var(--muted);margin:2px 0 0}

/* breuken en mintekens */
.math,.expr,.chain,.uw,.ordchip.m,.opt .fr{font-family:var(--math)}
.ordchip.m{font-size:22px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.15;margin:0 .08em}
.fr .nu{border-bottom:.09em solid currentColor;padding:0 .18em .02em}
.fr .de{padding:.04em .18em 0}
.fr.dfr{font-size:.86em}
.mx{margin-right:.04em}
.ng{display:inline-block;transform:scaleX(.8);margin-right:.02em}
.op{margin:0 .06em}
.pa{margin:0 .02em}

/* antwoord invoeren */
.answer{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 10px;font-family:var(--math)}
.signbox{font-size:34px;min-width:18px;text-align:right;color:var(--ink)}
.box{min-width:58px;height:58px;border:2px solid var(--line);border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:30px;padding:0 8px;cursor:pointer}
.box.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.box.empty{color:var(--muted)}
.fbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.fbox .box{min-width:52px;height:46px;font-size:24px}
.fbox hr{width:100%;min-width:60px;border:0;border-top:2.5px solid var(--ink);margin:0}
.inhelp{text-align:center;font-size:13px;color:var(--muted);margin:0 0 10px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.key{border:0;border-radius:10px;background:var(--key);height:52px;font-size:22px;font-family:var(--math);box-shadow:0 1px 0 var(--line)}
.key:active{background:var(--keyh)}
.key.fn{font-family:var(--ui);font-size:15px;font-weight:600}
.key.go.wide{grid-column:span 3}
.key.go{grid-column:span 2;background:var(--ac);color:#fff;font-family:var(--ui);font-weight:800;font-size:17px}
:root[data-theme="dark"] .key.go{color:#10131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .key.go{color:#10131A}}
.warn{color:var(--bad);text-align:center;font-size:14px;margin:6px 0 0;min-height:1em}

.opts{display:grid;gap:10px;margin-top:16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:13px 14px;text-align:left;font-size:18px;line-height:1.35}
.opts.three .opt,.opts.two .opt{text-align:center;font-size:20px}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.right{border-color:var(--good);background:var(--goods)}
.opt.wrong{border-color:var(--bad);background:var(--bads)}
.opt:disabled{cursor:default}

.ordwrap{margin-top:14px}
.ordlist{display:grid;gap:8px}
.ordchip{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 14px;text-align:left;font-size:17px;display:flex;gap:10px;align-items:center}
.ordchip .n{font-family:var(--ui);font-weight:800;color:var(--ac);min-width:1.2em}
.ordchip.used{opacity:.35}
.ordpicked{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;margin-bottom:10px}
.ordpicked .ph{color:var(--muted);font-size:14px;padding:8px;font-family:var(--ui)}
.ordrow{display:flex;gap:8px;margin-top:10px}
.ordrow .ghost{flex:0 0 auto}
.ordrow .big{flex:1}

/* feedback */
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:6px solid var(--muted);background:var(--paper)}
.fb.good{border-color:var(--good);background:var(--goods)} .fb.bad{border-color:var(--bad);background:var(--bads)} .fb.almost{border-color:var(--almost);background:var(--almosts)}
.fb h3{font-size:20px;font-weight:800}
.fb.good h3{color:var(--good)} .fb.bad h3{color:var(--bad)} .fb.almost h3{color:var(--almost)}
.fb .ans{margin:6px 0 0;font-size:16px}
.fb .ans .math{font-size:22px}
.uwbox{margin-top:10px;font-size:15px}
.uwbox summary{cursor:pointer;color:var(--muted)}
.uw{font-size:21px;line-height:1.7;margin:8px 0 2px;overflow-x:auto}
.uw .ln{white-space:nowrap}
.uw .ln b,.chain b{color:var(--ac)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;font-size:22px;line-height:1.8;margin:8px 0 2px}
.chain .eq{margin:0 .3em}
.chain .ck{white-space:nowrap}
.note{margin:8px 0 0;font-size:16px;line-height:1.5}
.note b{color:var(--ac)}
.tip,.ref{margin:8px 0 0;font-size:14px;color:var(--muted)}
.flag{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px 0 0}
.flag.done{text-decoration:none;color:var(--good)}
.next{margin-top:14px}
@media (prefers-reduced-motion:no-preference){
  .fb{animation:drop .28s ease-out}
  .uw .ln,.chain .ck{animation:write .35s ease-out backwards}
  .uw .ln:nth-child(2),.chain .ck:nth-child(3){animation-delay:.12s}
  .uw .ln:nth-child(3),.chain .ck:nth-child(5){animation-delay:.24s}
  .uw .ln:nth-child(4),.chain .ck:nth-child(7){animation-delay:.36s}
  .uw .ln:nth-child(n+5),.chain .ck:nth-child(n+9){animation-delay:.48s}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes write{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
}

/* resultaat */
.result{padding:22px 18px;text-align:center}
.result .score{font-family:var(--math);font-size:72px;line-height:1;font-weight:600;color:var(--ac)}
.result .score small{font-size:28px;color:var(--muted)}
.result h2{font-size:26px;margin:10px 0 4px;font-weight:800}
.result p{margin:0;color:var(--muted)}
.rlist{margin:18px 0 0;padding:0;list-style:none;text-align:left}
.rlist li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.rlist li span:last-child{font-family:var(--math);white-space:nowrap}
.stack{display:grid;gap:10px;margin-top:18px}

/* voortgang en markeringen */
.sect{padding:16px 16px 10px;margin-bottom:14px}
.sect h2{font-size:20px;font-weight:800;margin-bottom:6px}
.prow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:7px 0;font-size:15px}
.prow .pn{font-family:var(--math);color:var(--ac);font-weight:600}
.prow .bar{height:6px;margin-top:4px}
.prow .pc{font-family:var(--math);color:var(--muted);font-size:14px}
.flagitem{border-bottom:1px dashed var(--line);padding:10px 0;font-size:14px}
.flagitem b{font-weight:600}
.muted{color:var(--muted);font-size:15px;margin:4px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* pincode */
.pin{padding:30px 22px 24px;text-align:center;max-width:360px;margin:32px auto 0}
.pin h1{font-size:44px;font-weight:800;letter-spacing:-.03em}
.pin p{margin:6px 0 0;color:var(--muted)}
.dots{display:flex;gap:16px;justify-content:center;margin:22px 0 4px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ac);background:var(--paper)}
.dots i.on{background:var(--ac)}
.pin .warn{min-height:1.3em;margin:8px 0 6px}
.pinkeys{grid-template-columns:repeat(3,1fr);max-width:290px;margin:8px auto 0}
.pinkeys .key{height:60px;font-size:26px}
@media (prefers-reduced-motion:no-preference){.dots.bad{animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';
/* ================= hulpjes ================= */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const coin = (p = 0.5) => Math.random() < p;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }

class F {
  constructor(n, d = 1) { if (d === 0) throw new Error('deling door 0'); if (d < 0) { n = -n; d = -d; } this.n = n; this.d = d; }
  static of(x) { return x instanceof F ? x : new F(x, 1); }
  red() { if (this.n === 0) return new F(0, 1); const g = gcd(this.n, this.d); return new F(this.n / g, this.d / g); }
  add(o) { o = F.of(o); return new F(this.n * o.d + o.n * this.d, this.d * o.d).red(); }
  sub(o) { o = F.of(o); return new F(this.n * o.d - o.n * this.d, this.d * o.d).red(); }
  mul(o) { o = F.of(o); return new F(this.n * o.n, this.d * o.d).red(); }
  div(o) { o = F.of(o); if (o.n === 0) throw new Error('deling door 0'); return new F(this.n * o.d, this.d * o.n).red(); }
  eq(o) { o = F.of(o); return this.n * o.d === o.n * this.d; }
  cmp(o) { o = F.of(o); return this.n * o.d - o.n * this.d; }
  isInt() { return this.red().d === 1; }
  get v() { return this.n / this.d; }
}

/* ================= weergave (HTML) ================= */
// Net als in het boek: de negatieve min is korter dan de aftrekmin.
const NEG = '<span class="ng">-</span>';
const OPS = { '+': '+', '-': '−', '*': '·', ':': ':' };
const opH = o => `<span class="op">${OPS[o]}</span>`;
const frH = (t, b, cls = '') => `<span class="fr${cls}"><span class="nu">${t}</span><span class="de">${b}</span></span>`;
const intH = n => n < 0 ? NEG + Math.abs(n) : String(n);
function impH(f) { f = F.of(f).red(); if (f.d === 1) return intH(f.n); return (f.n < 0 ? NEG : '') + frH(Math.abs(f.n), f.d); }
function mixH(f) {
  f = F.of(f).red(); if (f.d === 1) return intH(f.n);
  const a = Math.abs(f.n), w = Math.floor(a / f.d), r = a % f.d;
  return (f.n < 0 ? NEG : '') + (w ? `<span class="mx">${w}</span>` : '') + frH(r, f.d);
}
const rawH = (n, d) => d === 1 ? intH(n) : (n < 0 ? NEG : '') + frH(Math.abs(n), d);
const decH = (neg, s) => (neg ? NEG : '') + s;
function plainF(f) { // voor de lijst met gemarkeerde vragen
  f = F.of(f).red(); if (f.d === 1) return String(f.n);
  const a = Math.abs(f.n), w = Math.floor(a / f.d), r = a % f.d;
  return (f.n < 0 ? '-' : '') + (w ? w + ' ' : '') + r + '/' + f.d;
}
const chainH = parts => `<div class="chain">${parts.map((p, i) => (i ? '<span class="eq">=</span>' : '') + `<span class="ck">${p}</span>`).join('')}</div>`;
const noteH = t => `<p class="note">${t}</p>`;

/* ================= expressies met stappen (rekenvolgorde) ================= */
// mini-taal: ~ = negatief getal, * = keer, : = delen, {teller|noemer} = deelstreep
function parse(s) {
  let i = 0;
  function list(end) {
    const out = [];
    while (i < s.length) {
      const c = s[i];
      if (c === ' ') { i++; continue; }
      if (end && end.includes(c)) return out;
      if (c === '{') { i++; const top = list('|'); i++; const bot = list('}'); i++; out.push({ k: 'df', top, bot }); continue; }
      if (c === '~' || /\d/.test(c)) {
        let neg = false; if (c === '~') { neg = true; i++; }
        let j = i; while (j < s.length && /\d/.test(s[j])) j++;
        const n = parseInt(s.slice(i, j), 10); i = j; out.push({ k: 'n', v: new F(neg ? -n : n) }); continue;
      }
      if ('+-*:'.includes(c)) { out.push({ k: 'op', o: c }); i++; continue; }
      if (c === '(' || c === ')') { out.push({ k: c }); i++; continue; }
      throw new Error('parse: ' + c);
    }
    return out;
  }
  return list('');
}

function checkNum(q, inp) {

  if (w === null && tn === null && td === null) return { res: 'empty' };
  if ((tn === null) !== (td === null)) return { res: 'incomplete', msg: 'Vul zowel de teller als de noemer in.' };
  if (td === 0) return { res: 'incomplete', msg: 'Een noemer kan geen 0 zijn.' };
  let val = F.of(w || 0);
  if (tn !== null) val = val.add(new F(tn, td));
  if (inp.sign < 0) val = val.mul(-1);
  if (!val.eq(q.ans)) return { res: 'wrong' };
  if (tn !== null) {

}

document.addEventListener('click', e => {

  else if (act === 'flag') flagNow();
  else if (act === 'retry') startRound({ kind: 'retry', items: QZ.res.filter(r => r.res !== 'good'), from: QZ.spec.kind === 'retry' ? QZ.spec.from : QZ.spec });
  else if (act === 'again') startRound(QZ.spec.kind === 'retry' ? QZ.spec.from : QZ.spec);
  else if (act === 'copyflags') {
    const txt = 'Gemarkeerde vragen uit de oefenapp:\n' + DB.flags.map(f => `- [${f.par}] ${f.vraag} | app: ${f.app}${f.cato ? ' | Cato: ' + f.cato : ''}`).join('\n');
    const m = document.getElementById('copymsg');
    try { navigator.clipboard.writeText(txt).then(() => { m.textContent = 'Gekopieerd. Plak de lijst in een bericht.'; }, () => { m.textContent = txt; }); } catch (err) { m.textContent = txt; }
  }
  else if (act === 'clearflags') { if (confirm('Weet je zeker dat je de lijst wilt wissen?')) { DB.flags = []; saveDB(); progress(); } }
  else if (act === 'reset') { if (confirm('Alle voortgang wissen?')) { DB.stats = {}; saveDB(); progress(); } }
});
function keyPress(k) {
  const q = QZ.qs[QZ.i]; if (q.type !== 'num') return;
  const I = QZ.inp, frac = q.mode === 'frac'; I.warn = '';
  if (/^\d$/.test(k)) { if ((I[I.f] || '').length < 4) I[I.f] = (I[I.f] === '0' ? '' : I[I.f]) + k; }
  else if (k === 'del') { if (I[I.f]) I[I.f] = I[I.f].slice(0, -1); else if (frac) { I.f = I.f === 'n' ? 't' : 'w'; } }
  else if (k === 'neg') I.sign = -I.sign;
  else if (k === 'tab') { if (frac) I.f = I.f === 'w' ? 't' : I.f === 't' ? 'n' : 'w'; }
  else if (k === 'clr') Object.assign(I, freshInput());
  else if (k === 'ok') { checkNumNow(); return; }
  renderQ();
}
document.addEventListener('keydown', e => {
  if (!QZ || !document.querySelector('.qbar')) return;
  const q = QZ.qs[QZ.i];
  if (QZ.done) { if (e.key === 'Enter') { e.preventDefault(); nextQ(); } return; }
  if (q.type === 'mc' && /^[1-4]$/.test(e.key) && +e.key <= q.options.length) { QZ.pick = +e.key - 1; finish(QZ.pick === q.correct ? 'good' : 'wrong'); return; }
  if (q.type !== 'num') return;
  if (/^\d$/.test(e.key)) keyPress(e.key);
  else if (e.key === 'Backspace') keyPress('del');
  else if (e.key === '-') keyPress('neg');
  else if (e.key === '/' && q.mode === 'frac') { QZ.inp.f = QZ.inp.f === 'w' ? 't' : 'n'; renderQ(); }
  else if (e.key === ' ' || e.key === 'Tab') { if (q.mode === 'frac') { e.preventDefault(); keyPress('tab'); } }
  else if (e.key === 'Enter') { e.preventDefault(); keyPress('ok'); }
});
/* ================= pincode (laagdrempelige drempel, geen echte beveiliging) ================= */
const PIN_HASH = '58d4bf1d';
function pinHash(s) { let x = 0x811c9dc5; for (const c of 'cato-wisk:' + s) { x ^= c.charCodeAt(0); x = Math.imul(x, 0x01000193) >>> 0; } return x.toString(16); }
let PIN = '';
function pinOk() { try { return localStorage.getItem(KEY + '-pin') === PIN_HASH; } catch (e) { return false; } }
function pinScreen(msg = '') {
  document.body.className = 'chm';
  $app.innerHTML = `<section class="pin paper"><h1>Hoi Cato</h1><p>Vul de pincode in.</p>
    <div class="dots ${msg ? 'bad' : ''}" aria-label="${PIN.length} van 4 cijfers ingevuld">${[0, 1, 2, 3].map(i => `<i class="${i < PIN.length ? 'on' : ''}"></i>`).join('')}</div>
    <p class="warn" aria-live="polite">${msg}</p>
    <div class="keys pinkeys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button class="key" data-pin="${d}">${d}</button>`).join('')}<span></span><button class="key" data-pin="0">0</button><button class="key fn" data-pin="del" aria-label="Wissen">⌫</button></div></section>`;
}
function pinPress(d) {
  if (d === 'del') PIN = PIN.slice(0, -1); else if (PIN.length < 4) PIN += d;
  if (PIN.length === 4) {
    const ok = pinHash(PIN) === PIN_HASH; PIN = '';
    if (ok) { try { localStorage.setItem(KEY + '-pin', PIN_HASH); } catch (e) { /* dan volgende keer opnieuw */ } home(); return; }
    pinScreen('Dat is niet de goede pincode.'); return;
  }
  pinScreen();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) pinPress(b.dataset.pin); });
document.addEventListener('keydown', e => { if (!document.querySelector('.pin')) return; if (/^\d$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace') pinPress('del'); });
if (pinOk()) home(); else pinScreen();
</script>
